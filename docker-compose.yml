version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: course_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-course_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Optional - for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: course_bot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Telegram Bot Application
  bot:
    build: .
    container_name: course_bot_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
    environment:
      # Platform
      PLATFORM: telegram

      # Telegram
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-course_bot}
      DB_USER: ${DB_USER:-bot_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Other settings
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BOT_USERNAME: ${BOT_USERNAME:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}

      # ── Cross-platform ──
      CROSS_PLATFORM_BOT_LINK: ${CROSS_PLATFORM_BOT_LINK:-}
      CROSS_PLATFORM_BOT_NAME: ${CROSS_PLATFORM_BOT_NAME:-}

      # ── Bidirectional sync ──
      SYNC_PEER_URL: ${SYNC_PEER_URL:-}
      SYNC_SECRET: ${SYNC_SECRET:-}
    volumes:
      - ./files:/app/files
      - ./backups:/app/backups
      - ./exports:/app/exports
      - ./logs:/app/logs
    command: python bot.py

  # Web Admin Panel
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: course_bot_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database (same as bot)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-course_bot}
      DB_USER: ${DB_USER:-bot_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}

      # Bot token (for file uploads via Telegram API)
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      PLATFORM: ${PLATFORM:-telegram}

      # Admin panel credentials
      ADMIN_WEB_USERNAME: ${ADMIN_WEB_USERNAME:-admin}
      ADMIN_WEB_PASSWORD: ${ADMIN_WEB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}

      # ── Bidirectional sync ──
      SYNC_PEER_URL: ${SYNC_PEER_URL:-}
      SYNC_SECRET: ${SYNC_SECRET:-}
    ports:
      - "${WEB_PORT:-8080}:8000"
    networks:
      - default

  # PgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: course_bot_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge
