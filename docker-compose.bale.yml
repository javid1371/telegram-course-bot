# ========================================
# Docker Compose — Bale Bot (Iranian Server)
# ========================================
# This file is used ONLY on the Iranian server.
# The Telegram bot continues using the original docker-compose.yml
# on the international server.
#
# Usage:
#   cp .env.bale.example .env
#   docker-compose -f docker-compose.bale.yml up -d --build

version: '3.8'

services:
  # PostgreSQL — local to Iranian server
  postgres:
    image: postgres:15-alpine
    container_name: bale_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-course_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - bale_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — local
  redis:
    image: redis:7-alpine
    container_name: bale_bot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - bale_redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Bale Bot Application
  bot:
    build: .
    container_name: bale_bot_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
    environment:
      # ── Platform ──
      PLATFORM: bale

      # ── Bale Bot Token (from @botfather on Bale) ──
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME:-bale_course_bot}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}

      # ── Database ──
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-course_bot}
      DB_USER: ${DB_USER:-bot_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}

      # ── Redis ──
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # ── Webhook / Event Emitter ──
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}

      # ── Cross-platform sync (optional) ──
      # URL of the Telegram server's sync API (when internet available)
      SYNC_PEER_URL: ${SYNC_PEER_URL:-}
      SYNC_SECRET: ${SYNC_SECRET:-}

      # ── Cross-platform link (shown to users) ──
      CROSS_PLATFORM_BOT_LINK: ${CROSS_PLATFORM_BOT_LINK:-}
      CROSS_PLATFORM_BOT_NAME: ${CROSS_PLATFORM_BOT_NAME:-}

      # ── Other ──
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "irn8n.javidmgdm.com:host-gateway"
    volumes:
      - ./files:/app/files
      - ./backups:/app/backups
      - ./exports:/app/exports
      - ./logs:/app/logs
    command: python bot.py

  # Web Admin Panel
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: bale_bot_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database (same as bot)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-course_bot}
      DB_USER: ${DB_USER:-bot_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}

      # Bot token (for file uploads via Bale API)
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      PLATFORM: bale

      # Admin panel credentials
      ADMIN_WEB_USERNAME: ${ADMIN_WEB_USERNAME:-admin}
      ADMIN_WEB_PASSWORD: ${ADMIN_WEB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}

      # ── Bidirectional sync ──
      SYNC_PEER_URL: ${SYNC_PEER_URL:-}
      SYNC_SECRET: ${SYNC_SECRET:-}
    ports:
      - "${WEB_PORT:-8080}:8000"
    extra_hosts:
      - "irn8n.javidmgdm.com:host-gateway"
    networks:
      - default

volumes:
  bale_postgres_data:
  bale_redis_data:

networks:
  default:
    driver: bridge
